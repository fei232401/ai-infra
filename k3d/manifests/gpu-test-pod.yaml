apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default
spec:
  nodeSelector:
    nvidia.com/gpu: "true"
  restartPolicy: Never
  containers:
    - name: gpu-test-ctr
      image: nvidia/cuda:12.4.0-base-ubuntu22.04
      command: ["sh", "-c", "/usr/lib/wsl/drivers/nvidia-smi -L && /usr/lib/wsl/drivers/nvidia-smi --query-gpu=name,memory.total --format=csv"]
      resources:
        limits:
          nvidia.com/gpu: 1
      securityContext:
        privileged: true
      env:
        - name: LD_LIBRARY_PATH
          value: "/usr/lib/wsl/drivers:/usr/lib/wsl/lib"
      volumeMounts:
        - name: driver-lib
          mountPath: /usr/lib/wsl/drivers
        - name: wsl-lib
          mountPath: /usr/lib/wsl/lib
  volumes:
    - name: driver-lib
      hostPath:
        path: /usr/lib/wsl/drivers/nvtfi.inf_amd64_b747199a5b009127
    - name: wsl-lib
      hostPath:
        path: /usr/lib/wsl/lib
