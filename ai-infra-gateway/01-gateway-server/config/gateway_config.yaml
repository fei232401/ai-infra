server:
  host: "0.0.0.0"
  port: 8000

auth:
  enabled: false
  jwt_secret: "change-me-in-production"
  jwt_algorithm: "HS256"
  jwt_expire_minutes: 60
  api_keys:
    - "test-api-key"

rate_limit:
  enabled: true
  capacity: 100
  refill_rate: 10

circuit_breaker:
  failure_threshold: 3
  timeout_seconds: 30

ollama:
  base_url: "http://ollama-service:11434"
  default_model: "qwen2.5:3b"
  timeout: 120

retry:
  max_attempts: 2
  backoff_seconds: 1

backends:
  cpu_ollama:
    base_url: "http://ollama-service:11434"
    type: "ollama"
    models:
      - "qwen2.5:1.5b"
      - "qwen2.5:3b"
      - "qwen2.5"
  gpu_vllm:
    base_url: "http://vllm-service:8000"
    type: "vllm_openai"
    models:
      - "qwen2.5-7b-awq"
      - "qwen2.5:7b"
