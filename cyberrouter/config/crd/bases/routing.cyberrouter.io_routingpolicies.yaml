# 手动维护的 RoutingPolicy CRD (controller-gen crd 生成器在本地 toolchain 下输出为空, 见 environment.md 踩坑)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routingpolicies.routing.cyberrouter.io
spec:
  group: routing.cyberrouter.io
  names:
    kind: RoutingPolicy
    listKind: RoutingPolicyList
    plural: routingpolicies
    singular: routingpolicy
    shortNames:
      - rp
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                rollout:
                  type: object
                  properties:
                    percentage:
                      type: integer
                      minimum: 0
                      maximum: 100
                    tenantFilter:
                      type: string
                rules:
                  type: array
                  items:
                    type: object
                    required: [id, priority, condition, action]
                    properties:
                      id:
                        type: string
                      priority:
                        type: integer
                      condition:
                        type: object
                        properties:
                          tokenCount:
                            type: string
                          complexity:
                            type: string
                            enum: [low, medium, high]
                          cacheHitProbability:
                            type: string
                      action:
                        type: object
                        required: [tier]
                        properties:
                          tier:
                            type: string
                          fallbackChain:
                            type: array
                            items:
                              type: string
                slo:
                  type: object
                  properties:
                    low:
                      type: object
                      properties:
                        maxP99Ms:
                          type: integer
                    medium:
                      type: object
                      properties:
                        maxP99Ms:
                          type: integer
                    high:
                      type: object
                      properties:
                        maxP99Ms:
                          type: integer
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                snapshotHash:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
