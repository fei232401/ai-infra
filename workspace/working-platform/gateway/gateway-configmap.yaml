apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: gateway
data:
  gateway_config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000

    ollama:
      base_url: "http://ollama-service.ai-platform.svc.cluster.local:11434"
      default_model: "qwen2.5:1.5b"
      timeout: 120

    auth:
      enabled: false
      jwt_secret: "ai-infra-gateway-jwt-secret-key-2026"
      jwt_algorithm: "HS256"
      jwt_expire_minutes: 60
      api_keys:
        - "sk-infra-gateway-dev-key-2026"

    rate_limit:
      enabled: true
      capacity: 10
      refill_rate: 5

    circuit_breaker:
      enabled: true
      failure_threshold: 3
      timeout_seconds: 30
      half_open_requests: 1

    retry:
      enabled: true
      max_attempts: 2
      backoff_seconds: 1

    backends:
      cpu_ollama:
        base_url: "http://ollama-service.ai-platform.svc.cluster.local:11434"
        type: "ollama"
        models:
          - "qwen2.5:1.5b"
          - "qwen2.5:3b"
          - "qwen2.5"
      gpu_vllm:
        base_url: "http://vllm-3b-service.ai-platform.svc.cluster.local:8000"
        type: "vllm_openai"
        models:
          - "qwen2.5-3b-awq"
          - "qwen2.5:3b"

    # CyberRouter 数据面: 快照 tier 名 → 实际后端 (快照优先路由)
    # default_model: 路由到此 tier 时, 请求 model 名映射为该后端支持的模型
    tiers:
      ollama-service:
        base_url: "http://ollama-service.ai-platform.svc.cluster.local:11434"
        type: "ollama"
        default_model: "qwen2.5:1.5b"
      vllm-3b-service:
        base_url: "http://vllm-3b-service.ai-platform.svc.cluster.local:8000"
        type: "vllm_openai"
        default_model: "/models/qwen2.5-3b-awq"
