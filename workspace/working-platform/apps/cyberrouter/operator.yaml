# CyberRouter Operator — 控制面部署 (in-cluster)
# 架构: Operator watch RoutingPolicy CRD → 编译快照 → 写 ConfigMap
#       → gateway(数据面) 挂载快照执行决策路由
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberrouter-controller
  namespace: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cyberrouter-controller
rules:
  - apiGroups: ["routing.cyberrouter.io"]
    resources: ["routingpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["routing.cyberrouter.io"]
    resources: ["routingpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cyberrouter-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cyberrouter-controller
subjects:
  - kind: ServiceAccount
    name: cyberrouter-controller
    namespace: ai-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberrouter-operator
  namespace: ai-platform
  labels:
    app: cyberrouter-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberrouter-operator
  template:
    metadata:
      labels:
        app: cyberrouter-operator
    spec:
      serviceAccountName: cyberrouter-controller
      containers:
        - name: manager
          image: cyberrouter-operator:v3
          imagePullPolicy: Never
          env:
            # Phase 3: 集群内 Service DNS 采集 vLLM 指标 (GPU 水位/命中率/队列)
            - name: VLLM_METRICS_URL
              value: "http://vllm-3b-service.ai-platform.svc.cluster.local:8000/metrics"
          ports:
            - containerPort: 8080
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
